<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#818cf8"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav">
            @for (item of navItems; track item.path) {
            <a [routerLink]="item.path" routerLinkActive="nav-active" class="nav-item" [title]="item.label">
                <ng-icon [name]="item.icon" size="18"></ng-icon>
                <span class="nav-text">{{ item.label }}</span>
            </a>
            }
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">{{ userInitials() }}</div>
                <div class="user-details">
                    <span class="user-name">{{ auth.currentUser()?.fullName ?? 'Admin' }}</span>
                    <span class="user-role">Administrador</span>
                </div>
            </div>
            <button class="logout-btn" (click)="auth.logout()" [title]="'Cerrar sesión'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </aside>

    <!-- Main -->
    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <h2 class="page-heading">{{ pageTitle() }}</h2>
            </div>
            <div class="topbar-right">
                <button class="theme-toggle" (click)="theme.toggle()" [title]="theme.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
                    <ng-icon [name]="theme.theme() === 'dark' ? 'heroSun' : 'heroMoon'" size="18"></ng-icon>
                </button>
                <div class="topbar-time">{{ currentTime() }}</div>
                <div class="notification-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </div>
            </div>
        </header>

        <main class="content">
            <router-outlet />
        </main>
    </div>
</div>
